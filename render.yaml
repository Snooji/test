# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: starside-movers-game
    runtime: node
    plan: starter            # a paid plan keeps the disk (your signup list); free works but loses signups on redeploy
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /data
      - key: GATE_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: CONVERSION_KEY      # for the booking-site webhook / pixel
        generateValue: true
      # optional, set in the Render dashboard:
      # DATABASE_URL   - Postgres (Render Postgres or Neon) so sign-ups live in a real database
      # RESEND_API_KEY + MAIL_FROM - send the opt-in confirmation email
      # CONTACT_EMAIL  - shown on /privacy for deletion requests
    disk:
      name: signups
      mountPath: /data
      sizeGB: 1
