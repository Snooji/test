<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700&display=swap">
<style>html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#17110c}
canvas{position:absolute;inset:0}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,12,8,.92) 0,rgba(18,12,8,.78) 36%,rgba(18,12,8,0) 58%)}
.txt{position:absolute;left:56px;top:58px;width:520px;color:#fbf3e6;font-family:Rubik,sans-serif}
.k{font:700 18px Rubik;letter-spacing:.12em;text-transform:uppercase;color:#ffb35c;margin:0 0 10px}
h1{font-family:Bungee,sans-serif;font-weight:400;font-size:86px;line-height:.92;margin:0;color:#fbf3e6;text-shadow:0 5px 0 #6b3410}
h1 span{color:#ff8a3d}
p{font-size:25px;line-height:1.35;margin:18px 0 0;color:#e9dcc8;max-width:470px}
.cta{display:inline-block;margin-top:26px;padding:12px 18px;border:2px solid #ff8a3d;border-radius:12px;font:700 20px Rubik;color:#ffd9b0}
</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script></head><body>
<div class="fade"></div><div class="txt"><div class="k">Starside Movers presents</div><h1>Let’s<br><span>Move It</span></h1>
<p>The moving-day party game. Pack the truck with your crew, don’t crush the fragile box.</p><div class="cta">Play free in your browser · 1–4 movers</div></div>
<script type="module">
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'; import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(1); r.setSize(1200, 630); r.outputColorSpace = THREE.SRGBColorSpace;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; document.body.prepend(r.domElement);
const sc = new THREE.Scene();
// warm night sky (gradient sphere) + moon
const sky = new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: {}, vertexShader: 'varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'varying vec3 p; void main(){ float h = normalize(p).y; vec3 top = vec3(0.05,0.04,0.035); vec3 hor = vec3(0.62,0.31,0.12); gl_FragColor = vec4(mix(hor, top, smoothstep(-0.02, 0.32, h)), 1.); }' }));
sc.add(sky);
const moon = new THREE.Mesh(new THREE.SphereGeometry(7, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffe9c2 })); moon.position.set(30, 38, -90); sc.add(moon);
const stars = new THREE.BufferGeometry(), pts = []; for (let i = 0; i < 260; i++) { const a = Math.random() * Math.PI - Math.PI / 2, b = 0.15 + Math.random() * 1.2; pts.push(Math.sin(a) * 150, Math.sin(b) * 150, -Math.cos(a) * 150); }
stars.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); sc.add(new THREE.Points(stars, new THREE.PointsMaterial({ color: 0xfff1d6, size: 0.6 })));
sc.add(new THREE.HemisphereLight(0xffe2c0, 0x3a2412, 1.25));
const sun = new THREE.DirectionalLight(0xffd6a0, 2.2); sun.position.set(-12, 22, 14); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 20, bottom: -20, near: 1, far: 80 }); sc.add(sun);
const rim = new THREE.DirectionalLight(0xff9a4d, 1.0); rim.position.set(20, 6, -10); sc.add(rim);
// lawn tiles + path
const lawn = new THREE.Group(); const G = [0x4c8f45, 0x56994c, 0x46853f];
for (let x = -40; x < 40; x += 2) for (let z = -30; z < 16; z += 2) { const m = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 2), new THREE.MeshLambertMaterial({ color: G[(Math.abs(x * 7 + z * 13)) % 3] })); m.position.set(x + 1, -0.1, z + 1); m.receiveShadow = true; lawn.add(m); }
sc.add(lawn);
for (let x = -6; x < 24; x += 1.5) { const m = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.06, 3.2), new THREE.MeshLambertMaterial({ color: (x / 1.5) % 2 ? 0xb9a58c : 0xc8b59b })); m.position.set(x, 0.03, 2); m.receiveShadow = true; sc.add(m); }
const L = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
async function put(url, { x = 0, y = 0, z = 0, h = 1.7, ry = 0, tint = null } = {}) {
  const g = (await L.loadAsync(url)).scene; g.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(g), s = h / (b.max.y - b.min.y);
  const piv = new THREE.Group(); g.position.set(-(b.min.x + b.max.x) / 2, -b.min.y, -(b.min.z + b.max.z) / 2); piv.add(g); piv.scale.setScalar(s); piv.position.set(x, y, z); piv.rotation.y = ry;
  g.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; const mats = [].concat(o.material); for (const m of mats) { if (m.map) m.map.magFilter = THREE.NearestFilter; if (tint) m.color.multiply(new THREE.Color(tint)); } } });
  sc.add(piv); return piv;
}
const M = 'models/';
// truck on the right: cab + open bay with boxes stacked
const bay = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.3, 4.2), new THREE.MeshLambertMaterial({ color: 0x2b211a })); bay.position.set(17, 0.55, -3); sc.add(bay);
for (const s of [-1, 1]) { const w = new THREE.Mesh(new THREE.BoxGeometry(5.5, 1.5, 0.2), new THREE.MeshLambertMaterial({ color: 0xf2e6d6 })); w.position.set(17, 1.4, -3 + s * 2.1); w.castShadow = true; sc.add(w);
  const st = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.22, 0.22), new THREE.MeshLambertMaterial({ color: 0xff8a3d })); st.position.set(17, 2.1, -3 + s * 2.1); sc.add(st); }
await put(M + 'env/cab.glb', { x: 22.2, y: 0.3, z: -3, h: 3.1, ry: Math.PI / 2, tint: 0xffc8a0 });
for (const [bx, by, bz] of [[15.2, 0.7, -4], [16.3, 0.7, -4], [15.2, 1.55, -4], [16.3, 0.7, -2.8], [17.5, 0.7, -3.6], [15.2, 0.7, -2.6]]) await put(M + 'items/box.glb', { x: bx, y: by, z: bz, h: 0.85, ry: Math.random() * 0.3 });
// the crew carrying things toward the truck, turned toward the viewer; boxes held at chest height
const crew = [['chars/c04.glb', 12.9, 5.4], ['chars/v09.glb', 15.4, 6.6], ['chars/c03.glb', 5.6, 3.8]];
for (const [c, x, z] of crew) { await put(M + c, { x, z, h: 1.75, ry: 0.45 }); await put(M + 'items/box.glb', { x: x + 0.25, y: 0.62, z: z + 0.55, h: 0.6, ry: 0.45 }); }
// two movers on a couch, one at each end
await put(M + 'chars/c01.glb', { x: 7.6, z: 7.6, h: 1.75, ry: 0.4 }); await put(M + 'chars/c05.glb', { x: 10.8, z: 7.0, h: 1.75, ry: 0.4 });
await put(M + 'items/couch.glb', { x: 9.2, y: 0.85, z: 7.7, h: 0.9, ry: 0.15 });
// greenery
for (const [n, x, z, h] of [['tree3', -14, -10, 5], ['tree1', 2, -14, 6], ['tree6', 9, -16, 5.4], ['tree2', -22, -4, 4.4], ['tree9', 24, 8, 4]]) await put(M + `env/${n}.glb`, { x, z, h, ry: Math.random() * 6 });
for (let i = 0; i < 16; i++) await put(M + `env/flower${i % 4}.glb`, { x: -6 + Math.random() * 30, z: 6.5 + Math.random() * 5, h: 0.55, ry: Math.random() * 6 });
const cam = new THREE.PerspectiveCamera(36, 1200 / 630, 0.5, 400); cam.position.set(7, 5.4, 18.5); cam.lookAt(12, 2.6, 0);
cam.setViewOffset(1200, 630, -170, 0, 1200, 630); // scene slides right, clear of the text
moon.position.set(26, 17, -62); moon.scale.setScalar(0.8);
r.render(sc, cam); document.body.dataset.done = 1;
</script></body></html>
